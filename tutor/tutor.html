<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel del tutor | Aula Virtual FAF</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#2563eb;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--border:#e2e8f0;--nav:#101c35}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--text)}aside{position:fixed;inset:0 auto 0 0;width:250px;background:var(--nav);color:#fff;padding:25px 18px}aside h2{font-size:20px;margin:0 0 8px}aside p{color:#b8c6dc;font-size:13px;margin-bottom:30px}.nav{display:block;color:#dce7f8;text-decoration:none;padding:13px;border-radius:10px;margin:6px 0}.nav.active,.nav:hover{background:#24385d;color:#fff}main{margin-left:250px;padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.top h1{margin:0;font-size:28px}.muted{color:var(--muted)}.btn{border:0;border-radius:9px;background:var(--primary);color:#fff;padding:11px 15px;cursor:pointer;font-weight:600}.btn.secondary{background:#e8eefb;color:#1d4ed8}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0}.card{background:var(--card);border:1px solid var(--border);border-radius:15px;padding:20px;box-shadow:0 4px 15px #0f172a08}.stat{font-size:28px;font-weight:700;margin-top:8px}.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:15px}.course h3{margin:0 0 8px}.course .desc{min-height:42px;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.notice{padding:12px;border-radius:10px;background:#eff6ff;color:#1d4ed8;margin-top:15px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:800px){aside{position:static;width:auto;padding:16px}aside .nav{display:inline-block;margin:4px}main{margin:0;padding:18px}.stats{grid-template-columns:1fr}}
</style></head><body>
<aside><h2><i class="fa-solid fa-graduation-cap"></i> Aula Virtual FAF</h2><p>Panel de gestión académica</p><a class="nav active" href="tutor.html"><i class="fa-solid fa-book-open"></i> Mis cursos</a><a class="nav" href="#" onclick="salir();return false"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</a></aside>
<main><div class="top"><div><h1>Panel del tutor</h1><p class="muted" id="welcome">Gestiona tus cursos, estudiantes y calificaciones.</p></div><button class="btn" onclick="crearCursoUI()"><i class="fa-solid fa-plus"></i> Crear curso</button></div>
<div class="stats"><div class="card"><span class="muted">Mis cursos</span><div class="stat" id="nCursos">—</div></div><div class="card"><span class="muted">Estudiantes inscritos</span><div class="stat" id="nEstudiantes">—</div></div><div class="card"><span class="muted">Actividades</span><div class="stat" id="nActividades">—</div></div></div>
<section class="card"><div class="row"><div><h2 style="margin:0">Mis cursos</h2><p class="muted">Abre un curso para administrar contenido, estudiantes y notas.</p></div><button class="btn secondary" onclick="cargarCursos()"><i class="fa-solid fa-rotate"></i> Actualizar</button></div><div id="courses" class="courses"><div class="empty">Cargando cursos…</div></div></section><div id="msg"></div></main>
<script>
let sb,perfil,authUser;const CREATE_COURSE_FUNCTION='google-drive-create-course';
async function init(){try{const cfg=await fetch('../config.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('No se encontró ../config.json');return r.json()});sb=window.supabase.createClient(cfg.supabase.url,cfg.supabase.anonKey);const {data:{session}}=await sb.auth.getSession();if(!session){location.href='../index.html';return}authUser=session.user;const {data:p,error}=await sb.from('usuarios').select('id,nombre,apellido,email,rol,activo').eq('id',authUser.id).maybeSingle();if(error||!p||!p.activo||!['tutor','administrador'].includes(p.rol)){throw Error('Tu usuario no tiene permiso para entrar al panel de tutor.')}perfil=p;document.getElementById('welcome').textContent=`Hola, ${p.nombre||''}. Gestiona tus cursos, estudiantes y calificaciones.`;await cargarCursos()}catch(e){document.getElementById('courses').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function cargarCursos(){if(!sb||!perfil)return;const el=document.getElementById('courses');el.innerHTML='<div class="empty">Cargando cursos…</div>';let q=sb.from('cursos').select('id,nombre,descripcion,tutor_id,drive_folder_id,activo,created_at').eq('activo',true).order('created_at',{ascending:false});if(perfil.rol!=='administrador')q=q.eq('tutor_id',authUser.id);const {data,error}=await q;if(error){el.innerHTML=`<div class="empty">No se pudieron cargar los cursos: ${esc(error.message)}</div>`;return}document.getElementById('nCursos').textContent=(data||[]).length;const ids=(data||[]).map(c=>c.id);let nEst=0,nAct=0;if(ids.length){const a=await sb.from('curso_estudiantes').select('id',{count:'exact',head:true}).in('curso_id',ids).eq('activo',true);nEst=a.count||0;const b=await sb.from('actividades').select('id',{count:'exact',head:true}).in('curso_id',ids).eq('activo',true);nAct=b.count||0}document.getElementById('nEstudiantes').textContent=nEst;document.getElementById('nActividades').textContent=nAct;if(!data?.length){el.innerHTML='<div class="empty">Aún no hay cursos. Usa “Crear curso” para comenzar.</div>';return}el.innerHTML=data.map(c=>`<article class="card course"><h3>${esc(c.nombre)}</h3><div class="desc">${esc(c.descripcion||'Sin descripción')}</div><p class="muted"><i class="fa-solid fa-users"></i> Curso activo</p><button class="btn" onclick="abrirCurso('${c.id}')">Administrar curso <i class="fa-solid fa-arrow-right"></i></button></article>`).join('')}
function abrirCurso(id){sessionStorage.setItem('cursoSeleccionado',id);location.href='curso.html'}
async function crearCursoUI(){const nombre=prompt('Nombre del curso:');if(!nombre||!nombre.trim())return;const descripcion=prompt('Descripción del curso (opcional):')||'';try{const {data:{session}}=await sb.auth.getSession();const r=await fetch(`${sb.supabaseUrl}/functions/v1/${CREATE_COURSE_FUNCTION}`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':sb.supabaseKey},body:JSON.stringify({nombre:nombre.trim(),descripcion})});const j=await r.json();if(!r.ok)throw Error(j.error||j.message||'No se pudo crear el curso');document.getElementById('msg').innerHTML='<div class="notice">Curso creado correctamente con sus carpetas de Google Drive.</div>';await cargarCursos()}catch(e){alert('No se pudo crear el curso: '+e.message)}}
async function salir(){if(sb)await sb.auth.signOut();location.href='../index.html'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init();
</script></body></html>
